version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "eu-west-2"
    IMAGE_REPO_NAME: "house-price-ml-api"
    IMAGE_TAG: "latest"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR Public
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - REPOSITORY_URI=public.ecr.aws/c9m5s2z9/house-price-ml-api
  build:
    commands:
      - echo Building Docker image
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
  post_build:
    commands:
      - echo Pushing Docker image to ECR Public
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - printf '[{"name":"house-price-ml-api","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
